
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Watch & Buy Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>Watch & Buy Links Test</h1>
    
    <div class="test-section">
        <h2>1. Firebase Configuration Test</h2>
        <div id="firebase-test"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Video Links Data Test</h2>
        <div id="video-links-test"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Product SKU Resolution Test</h2>
        <div id="sku-test"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCrLCButDevLeILcBjrUCd9e7amXVjW-uI",
            authDomain: "auric-a0c92.firebaseapp.com",
            projectId: "auric-a0c92",
            storageBucket: "auric-a0c92.firebasestorage.app",
            messagingSenderId: "878979958342",
            appId: "1:878979958342:web:e6092f7522488d21eaec47",
            measurementId: "G-ZYZ750JHMB"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        async function runTests() {
            const firebaseTest = document.getElementById('firebase-test');
            const videoLinksTest = document.getElementById('video-links-test');
            const skuTest = document.getElementById('sku-test');

            // Test 1: Firebase
            try {
                firebaseTest.innerHTML = '<div class="test-result success">✅ Firebase initialized successfully</div>';
            } catch (error) {
                firebaseTest.innerHTML = `<div class="test-result error">❌ Firebase error: ${error.message}</div>`;
            }

            // Test 2: Load video links
            try {
                const videoLinksDoc = await db.collection('settings').doc('watchBuyVideos').get();
                
                if (!videoLinksDoc.exists) {
                    videoLinksTest.innerHTML = '<div class="test-result error">❌ No video links configured in Firestore</div>';
                } else {
                    const videoLinks = videoLinksDoc.data();
                    let html = '<div class="test-result success">✅ Video links loaded successfully</div>';
                    
                    for (let i = 1; i <= 6; i++) {
                        const videoData = videoLinks[`video${i}`];
                        if (videoData && videoData.productSKU) {
                            html += `<div class="test-result info">Video ${i}: SKU = ${videoData.productSKU}, Name = ${videoData.productName || 'Not set'}</div>`;
                        } else {
                            html += `<div class="test-result error">Video ${i}: No SKU configured</div>`;
                        }
                    }
                    
                    videoLinksTest.innerHTML = html;
                }
            } catch (error) {
                videoLinksTest.innerHTML = `<div class="test-result error">❌ Error loading video links: ${error.message}</div>`;
            }

            // Test 3: Test product SKU resolution
            try {
                const videoLinksDoc = await db.collection('settings').doc('watchBuyVideos').get();
                if (videoLinksDoc.exists) {
                    const videoLinks = videoLinksDoc.data();
                    let html = '';
                    
                    for (let i = 1; i <= 6; i++) {
                        const videoData = videoLinks[`video${i}`];
                        if (videoData && videoData.productSKU) {
                            const sku = videoData.productSKU;
                            const testUrl = `product-detail.html?id=${encodeURIComponent(sku)}`;
                            html += `<div class="test-result info">
                                Video ${i}: <a href="${testUrl}" target="_blank">${testUrl}</a>
                                <br>Expected to load product with SKU: ${sku}
                            </div>`;
                        }
                    }
                    
                    skuTest.innerHTML = html || '<div class="test-result error">No SKUs to test</div>';
                }
            } catch (error) {
                skuTest.innerHTML = `<div class="test-result error">❌ Error testing SKU resolution: ${error.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
